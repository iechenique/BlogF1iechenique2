<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotos del GP Monaco 2026</title>
    <link rel="stylesheet" href="estilos/estilos.css">
</head>
<body>
    <header>
        <h1>Gran Premio de Monaco 2026</h1>
        <button onclick="toggleDarkMode()" id="darkModeToggle" style="float: right;">🌙 Modo Oscuro</button>
    </header>
    
    <nav>
        <ul>
            <li><a href="index.html">Index</a></li>
            <li><a href="FotosGP.html">Fotos del GP</a></li>
            <li><a href="clasificacion.html">Clasificación</a></li>
            <li><a href="contacto.html">Contacto</a></li>
        </ul>
    </nav>
    
    <main>
        <div class="gallery">
            <div class="photo-item">
                <img src="imagenes/Salida.jpg" 
                     alt="Recta principal"
                     class="gallery-image">
                <p class="photo-caption">Recta principal</p>
            </div>
            
            <div class="photo-item">
                <img src="imagenes/SubidaMonaco.jpg" 
                     alt="Imagen del primer sector"
                     class="gallery-image">
                <p class="photo-caption">Primer sector</p>
            </div>
            
            <div class="photo-item">
                <img src="imagenes/Ferrari.jpg" 
                     alt="Monoplaza de Ferrari"
                     class="gallery-image">
                <p class="photo-caption">Monoplaza de Ferrari</p>
            </div>
            
            <div class="photo-item">
                <img src="imagenes/CurvaMonaco.jpg" 
                     alt="Curva mítica de 180 grados"
                     class="gallery-image">
                <p class="photo-caption">Curva mítica de 180 grados</p>
            </div>
        </div>
         <div class="masfotossec">
            <p class="masfotostext">¿Quieres ver más fotos del circuito de Mónaco?</p>
            <a href="https://unsplash.com/es/s/fotos/gp-monaco" 
               target="_blank" 
               class="masfotosboton">
                Ver más fotos en Unsplash
            </a>
        </div>
    </main>
    
    <footer>
        <p>Domingo 7 de junio de 2026</p>
    </footer>
    <script src="funciones/funciones.js"></script>

</html>
